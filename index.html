<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
   <header>
    <div class="logo-block">
      <h1>Task<span class="accent">Flow</span></h1>
      <p class="logo-subtitle">Modern JS · Teaching Project</p>
    </div>

    <div class="header-stats">
      <div class="stat-chip">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-chip">
        <span class="stat-num" id="stat-active">0</span>
        <span class="stat-label">Active</span>
      </div>
      <div class="stat-chip">
        <span class="stat-num" id="stat-done">0</span>
        <span class="stat-label">Done</span>
      </div>
    </div>

    <div class="progress-block">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
  </header>

   <main>
          <aside>
      <h2>New Task</h2>

      <div class="field">
        <label for="task-input">Task Title</label>
        <input
          type="text"
          id="task-input"
          placeholder="What needs doing?"
          maxlength="80"
          autocomplete="off"
        />
        <p class="error-msg" id="error-msg">Please enter a task title.</p>
      </div>

      <div class="field">
        <div class="select-group">
          <div>
            <label for="priority-select">Priority</label>
            <select id="priority-select">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div>
            <label for="category-select">Category</label>
            <select id="category-select">
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Learning">Learning</option>
              <option value="Health">Health</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn-add" onclick="addTask()">+ Add Task</button>
  
    </aside>

     <section class="task-panel">

      <div class="panel-heading">
        <h2>My Tasks</h2>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-row">
        <button class="filter-tab active" data-filter="all"       onclick="setFilter('all')">All <span class="filter-count" id="count-all">0</span></button>
        <button class="filter-tab"        data-filter="active"    onclick="setFilter('active')">Active <span class="filter-count" id="count-active">0</span></button>
        <button class="filter-tab"        data-filter="completed" onclick="setFilter('completed')">Done <span class="filter-count" id="count-completed">0</span></button>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <span class="toolbar-label" id="toolbar-label">0 tasks</span>
        <button class="btn-clear" onclick="clearCompleted()">Clear completed</button>
      </div>

      <!-- Cards -->
      <div id="task-list"></div>

      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <span class="empty-icon">🌌</span>
        <h3>Nothing here yet</h3>
        <p>Add your first task using the panel on the left.</p>
      </div>

    </section>
   </main>
    <script src="js/app.js"></script>
</body>
</html>
